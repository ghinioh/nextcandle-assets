name: 예약 릴스 발행

on:
  schedule:
    # ⚠️GitHub 크론이 일관되게 ~10h 지연되는 관측(8/27·8/28) → 특정 시각 예약은 새벽에 착지해 창가드에 막힘.
    # 매시간 발사해 어느 하나는 KST 11~22 창 안에 착지하도록 함. 스크립트가 창가드+하루1배치로 자기제한(중복 없음).
    - cron: '0 * * * *'    # 매시간(UTC 정각)
  workflow_dispatch:
    inputs:
      dry:
        description: 'DRY 모드(1이면 API 호출 안 함·선택만 출력)'
        default: '0'
      date_override:
        description: '오늘 날짜 강제 YYYY-MM-DD (테스트용·비우면 실제 KST)'
        default: ''
      hour_override:
        description: 'KST 시(0~23) 강제(테스트용·창 가드 우회)'
        default: ''

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 발행
        env:
          INSTA_TOKEN_B1: ${{ secrets.INSTA_TOKEN_B1 }}
          INSTA_TOKEN_B2: ${{ secrets.INSTA_TOKEN_B2 }}
          INSTA_TOKEN_B3: ${{ secrets.INSTA_TOKEN_B3 }}
          PUBLISH_DRY: ${{ github.event.inputs.dry }}
          PUBLISH_DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          PUBLISH_HOUR_OVERRIDE: ${{ github.event.inputs.hour_override }}
        run: node publish/publish.mjs
      - name: published 마커 커밋
        if: ${{ always() && github.event.inputs.dry != '1' }}
        run: |
          if [ -n "$(git status --porcelain publish/published.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publish/published.json
            git commit -m "publish marker $(date -u +%FT%TZ)"
            git push
          else
            echo "published.json 변경 없음"
          fi
